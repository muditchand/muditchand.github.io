name: Update manifest
on:
  push:
    branches: [main, redesign]
    paths: ['content/**', '!content/manifest.json', 'tools/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-manifest.mjs
      - run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add content/manifest.json
          git diff --cached --quiet || (git commit -m "Update manifest" && git push)